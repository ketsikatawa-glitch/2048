<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <style>
    * {
      margin : 0;
    }

    body {
      overflow : hidden;
    }

    header {
      margin : 20px 0;
      text-align : center;
    }

    #line {
      width: 700px;
      margin : 0 auto;
      height: 1px;
      background-color: black;
    }

    .container {
      min-height: 70vh;
      display : flex;
      justify-content : center;
      align-items : center;
    }

    .box-grid {
      background-color: blue;
      padding : 10px;
      display : grid;
      grid-template-columns: repeat(4, 100px);
      grid-auto-rows: 100px;
      gap : 10px;

      justify-content : center;
      align-content: center;
    }

    .box {
      background-color: rgb(49, 51, 122);
      color : white;
      display : flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: 700;
    }

    .style-score {
      text-align : center;
      font-size: 50px;
    }
  </style>
</head>
<body>
  <header>
    <h1>2048</h1>
  </header>
  <div id="line"></div>

  <div class="container">
    <div class="box-grid">
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
      <div class="box js-box"></div>
    </div>
  </div>

  <div class="style-score score-js">
  </div>

  <script src="2048.js" type="module"></script>
</body>
</html>
